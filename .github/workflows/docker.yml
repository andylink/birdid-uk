name: Build and push Docker image

# Builds a multi-platform image and pushes it to GitHub Container Registry
# (ghcr.io/andylink/birdid-uk) whenever a version tag is pushed.
#
# The image is tagged as:
#   ghcr.io/andylink/birdid-uk:v1.2.3   (exact version)
#   ghcr.io/andylink/birdid-uk:latest   (always points to newest release)
#
# No secrets needed — GITHUB_TOKEN is granted write access to packages
# automatically by the `packages: write` permission below.
#
# Platforms: linux/amd64 (x86 servers/NAS) + linux/arm64 (Raspberry Pi 4/5)

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # allows push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andylink/birdid-uk
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
