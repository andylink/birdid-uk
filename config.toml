# Species to permanently suppress, regardless of confidence.
# Distinct from noise_labels — use this for real species you simply don't want
# recorded (e.g. abundant garden birds that flood the log).
# Note: use the exact IOC common names returned by BirdNET (run the detector
# and check terminal output to confirm names).
# e.g. exclude = ["Common Wood-Pigeon", "Carrion Crow"]
exclude = []


[filter]
# Set enabled = true to apply a high-pass filter to audio before inference.
# Helps remove low-frequency noise (wind, traffic, HVAC) without affecting
# saved clips — the raw unfiltered audio is always written to disk.
enabled   = true
cutoff_hz = 150    # Hz — bird calls typically start well above this
order     = 5      # Butterworth filter order; higher = steeper rolloff


[retention]
# Clip retention / disk cleanup policy for data/detections/.
# The cleanup thread runs on startup and then every run_interval_seconds.
enabled               = true
max_age_days          = 30     # delete clips older than this (0 = disable age check)
max_usage_percent     = 90.0   # also delete oldest clips when disk is this full
min_clips_per_species = 5      # always keep at least this many clips per species
run_interval_seconds  = 3600   # how often the cleanup thread checks (seconds)


[log]
# Set enabled = true to write output to a rotating log file in addition to stdout.
enabled  = true
path     = "data/bird_detector.log"

# Log verbosity level: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL".
# "INFO" is recommended for normal use.  Switch to "DEBUG" temporarily to
# see seasonal/BOU filter decisions (out-of-season and non-BOU suppression
# are logged at DEBUG).
level = "DEBUG"

# rotation = "daily"  — new file each midnight; keeps backup_count previous files
# rotation = "size"   — rotate when the file exceeds max_size_bytes
rotation       = "daily"
max_size_bytes = 10485760   # 10 MB — only used when rotation = "size"
backup_count   = 7          # number of old log files to keep


[database]
# Backend type: "sqlite" (default, zero config) or "postgresql".
# For TimescaleDB, keep type = "postgresql" and set timescaledb = true —
# this runs create_hypertable on detections.timestamp at init time.
# psycopg2-binary must be installed when using postgresql:
#   pip install psycopg2-binary
type        = "sqlite"
host        = "localhost"
port        = 5432
name        = "birds"
username    = ""
password    = ""
timescaledb = false


[mqtt]
# Set enabled = true to publish each detection as JSON to an MQTT broker.
# paho-mqtt must be installed: pip install paho-mqtt
enabled  = false
broker   = "localhost"
port     = 1883
topic    = "birds/detections"
username = ""
password = ""
retain   = false


[birdmap]
# Set enabled = true to forward detections to birdmap.co.uk.
# Register an account at birdmap.co.uk, create a station, and paste the
# returned API key and station ID here.
enabled      = false
api_url      = "http://localhost:8000"
api_key      = "bm_RMeuZyv7jmZo07h89zMZnJuPo0I0hguyw14SUAW9UJb8yBDK"
station_id   = 1                # assigned by server on registration
upload_audio = true         # include base64-encoded WAV clip in each POST (max 2 MB)


[bou_filter]
# Set enabled = true to restrict detections to species on the BTO
# UK checklist (species_bto_FINAL_filtered.json).
#
# Species are matched to BirdNET labels via the explicit international_english_name
# field in the JSON, with scientific-name and common-name fallbacks.  Any
# detection whose BirdNET common name cannot be mapped to a listed species is
# silently discarded.  On startup the number of matched species is logged so
# you can verify coverage.
#
enabled = true


[seasonal_filter]
# Set enabled = true to suppress out-of-season detections using the
# ISO-week-based presence data in uk_seasonal_filter.json (generated by
# build_uk_seasonal_filter.py from GBIF Great Britain occurrence data).
#
# For each detection the current ISO 8601 week (1–52) is compared against
# the species' allowed-weeks set.  Species absent from the JSON are assumed
# year-round (safe default).  Species listed but outside their allowed
# weeks are silently dropped, leaving a note at DEBUG level.
#
# To customise, copy uk_seasonal_filter.json, edit it, and point filter_json
# at the copy.
#
# This filter sits after the BOU allowlist (Step 3b) and before the
# per-species confidence threshold (Step 4).
enabled     = true
filter_json = "uk_seasonal_filter.json"


[inference]
# model selects the active classifier backend.
#
# "birdnet" (default) — BirdNET GLOBAL 6K V2.4, bundled with birdnet-analyzer.
#                       No extra setup required.
# "perch"             — Google Perch v2, a TensorFlow model downloaded from
#                       Kaggle on first run (~400 MB cached in ~/.cache/kagglehub).
#                       Requires: pip install 'perch-hoplite[tf]'
#                       Requires: Kaggle credentials (see requirements.txt).
#                       Uses 5-second analysis windows at 32 kHz (audio is
#                       resampled internally; recording always stays at
#                       cfg.audio.sample_rate).
model = "birdnet"


[cross_validation]
# Dual-model cross-validation: when enabled, every confirmed detection from
# the primary model ([inference] model) is re-evaluated by the secondary model
# (whichever of birdnet / perch is NOT the primary).  Both models must be
# installed and configured for this to work.
#
# Species agreement is compared via BTO-resolved names so that label-namespace
# differences between BirdNET (IOC English) and Perch (eBird) are bridged.
#
# When models agree, detections.confidence is set to the arithmetic mean of
# both scores.  The raw primary score is always stored in
# detections.primary_confidence for auditability.
enabled = true

# If primary model confidence >= skip_threshold, cross-validation is skipped
# and the detection is saved unconditionally (high-confidence shortcut).
# This avoids the cost of running the secondary model when the primary is
# already very confident.
skip_threshold = 0.90

# Action when models disagree on species:
#   "drop"  — silently discard the detection (default; maximises precision)
#   "flag"  — save with flagged = true for manual review in the dashboard
#
# Per-species overrides: add  on_disagree = "flag"  inside a
# [species."<name>"] block to override for specific species (e.g. rare or
# nocturnal birds where a missed detection is costly).
on_disagree = "drop"

# Minimum confidence for the *secondary* model's top result to count as a
# candidate during cross-validation.  This is intentionally much lower than
# [defaults] min_confidence because BirdNET and Perch operate on very different
# probability scales:
#   • BirdNET:  logistic scores up to ~0.99 for a clear species call.
#   • Perch:    softmax over ~10 000+ classes — a strongly-matched species
#               might only reach 0.03–0.08, so the primary min_confidence (0.6)
#               would filter out every valid Perch result, causing CV to always
#               report "no candidates → disagree" and drop real detections.
# Setting this to 0.01 (the raw inference floor) lets any Perch species
# probability that clears the floor participate in the comparison.
# If the primary model is Perch and secondary is BirdNET, 0.01 is still safe —
# BirdNET returns very few candidates below 0.1 in practice.
cv_min_confidence = 0.01



# ── Per-species overrides ──────────────────────────────────────────────────────
# Any key from [defaults] can be overridden here for a specific species.
# The species name must match the cleaned common name produced by the classifier
# (i.e. what you see printed in the terminal).
# Keys not listed here fall back to [defaults].
#
# Cross-validation override: add  on_disagree = "flag"  to flag disagreements
# for review rather than dropping them.  Useful for rare or nocturnal species
# where a missed detection matters more than a false positive.

[species."House Sparrow"]
min_confidence   = 0.90
cooldown_seconds = 90

[species."Tawny Owl"]
min_detections = 1
#on_disagree    = "flag"   # rare nocturnal: flag CV disagreements rather than drop

[species."Barn Owl"]
min_detections = 1
#on_disagree    = "flag"   # rare nocturnal: flag CV disagreements rather than drop

[species."Common Whitethroat"]
min_confidence = 0.20
min_detections = 1