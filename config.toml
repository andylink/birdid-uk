# ── Bird Detector Configuration ───────────────────────────────────────────────

[general]
# IANA timezone for the detector location.  Used for display, date filters and
# "today" boundaries in the dashboard.  "Europe/London" handles GMT/BST automatically.
timezone     = "Europe/London"

# Display name shown in the dashboard header (empty = default "BirdNet-UK").
station_name = "TheCLinks"


[location]
# WGS-84 decimal degrees — used for sunrise/sunset calculations.
lat = 52.69867   # Norfolk, UK
lon = 1.67531


[paths]
# Paths are relative to the project root (where detect.py is run from).
detections_dir = "data/detections"
db_path        = "data/birds.db"


[audio]
# Recording sample rate (Hz).  This is the capture rate, not the model input rate.
# Both BirdNET and Perch resample internally, so set this to whatever your hardware
# supports.  48000 works with virtually all modern USB audio interfaces.
sample_rate    = 48000

# Advance the rolling analysis window by this many seconds each step.
hop_seconds    = 1

# Audio source — select the capture backend:
#
#   "sounddevice"  — local microphone (USB, built-in, or any PortAudio device).
#                    Use `python -m sounddevice` to list device indices and set
#                    the `device` key below.
#
#   "rtsp"         — network microphone or IP camera audio stream via FFmpeg.
#                    Configure the stream URL and options in [audio.rtsp] below.
#                    Requires ffmpeg to be installed on the system.
#
source = "sounddevice"

# Clip mode controls what audio is saved around each detection.
#
#   "window" — save the model analysis window plus window_pad_seconds of leading
#              audio.  No post-detection audio.  Produces clean single-species
#              clips ideal for fine-tuning; ~5× smaller than "full".
#                BirdNET: 0.5 + 3 = 3.5 s   Perch: 0.5 + 5 = 5.5 s
#
#   "full"   — legacy mode: save clip_seconds centred on the detection
#              (pre_capture_seconds before the window, remainder after).
#
clip_mode           = "window"
window_pad_seconds  = 0.5   # leading audio before the window (0.0–10.0 s); "window" mode only

# Settings used only when clip_mode = "full":
clip_seconds            = 15   # total saved clip length
pre_capture_seconds     = 2    # extra audio before the analysis window
capture_buffer_seconds  = 30   # ring buffer size; must be > clip_seconds + margin

# Microphone device index (from `python -m sounddevice`).
# Only used when source = "sounddevice".
device = 0


[audio.rtsp]
# RTSP stream settings — only used when [audio] source = "rtsp".
#
# url        — full RTSP URL of the audio stream.
#              Examples:
#                rtsp://192.168.1.100:554/audio          (IP microphone)
#                rtsp://admin:password@192.168.1.50/av0  (IP camera with audio)
#
# transport  — RTP transport protocol:
#                "tcp"  — reliable, recommended for most networks (default)
#                "udp"  — lower latency; may drop packets on congested networks
#
# reconnect_delay_seconds — how long to wait before retrying after a stream drop.
#
# ffmpeg_path — path to the ffmpeg binary.  Leave as "ffmpeg" if it is on
#               the system PATH; set an absolute path otherwise.
#
url                     = "rtsp://192.168.1.100:554/audio"
transport               = "tcp"
reconnect_delay_seconds = 5
ffmpeg_path             = "ffmpeg"


[inference]
# "birdnet" (default) — BirdNET GLOBAL 6K V2.4; no extra setup required.
# "perch"             — Google Perch v2; requires pip install 'perch-hoplite[tf]'
#                       and Kaggle credentials.  Model (~400 MB) downloads on first
#                       run and is cached in ~/.cache/kagglehub/.  Uses 5-second windows.
model = "birdnet"


[defaults]
# Minimum inference confidence to accept a detection.
min_confidence   = 0.6

# Minimum gap (seconds) between saved clips for the same species.
cooldown_seconds = 30

# Confirmation filter: require this many hits within confirmation_window_seconds
# before saving.  Filters transient false positives without slower inference.
# Set min_detections = 1 to save on the first hit (original behaviour).
min_detections              = 2
confirmation_window_seconds = 9

# Species to permanently suppress regardless of confidence (exact IOC common names).
# Use this for real species you don't want recorded (e.g. abundant garden birds).
# Check the terminal output to confirm the exact name returned by the classifier.
# e.g. exclude = ["Common Wood-Pigeon", "Carrion Crow"]
exclude = []


[filter]
# High-pass filter applied to audio before inference (not to saved clips).
# Removes low-frequency noise (wind, traffic, HVAC).
enabled   = true
cutoff_hz = 150   # bird calls typically start well above 150 Hz
order     = 5     # Butterworth order; higher = steeper rolloff


[seasonal_filter]
# ISO-week presence filter using uk_seasonal_filter.json (generated from GBIF
# Great Britain occurrence data by build_uk_seasonal_filter.py).
# Each detection's ISO 8601 week (1–52) is checked against the species' allowed
# weeks.  Species absent from the JSON are assumed year-round.
# Set enabled = false to disable (not recommended for UK operation).
enabled     = true
filter_json = "filters/uk_seasonal_filter.json"


[nocturnal_filter]
# Time-of-day gate for nocturnal and crepuscular species.
# Detections of listed species outside their active window (i.e. in the middle
# of the day) are discarded as likely false positives.
#
# uk_nocturnal_filter.json covers: Tawny Owl, Western Barn Owl, Long-eared Owl,
# European Nightjar, Eurasian Woodcock, Corn Crake, Black-crowned Night Heron.
#
# Two window types are supported (set in the JSON or via per-species overrides):
#   "sunset_sunrise" — active from (sunset + offset) to (sunrise + offset).
#                      Negative offset = before the event, positive = after.
#                      Uses [location] lat/lon for sunrise/sunset calculation.
#   "fixed"         — fixed local clock range, e.g. {start = "21:00", end = "05:00"}.
#                      Windows spanning midnight (start > end) are handled correctly.
#
# Per-species override example (add to any [species."Name"] block):
#   active_hours = {type = "sunset_sunrise", sunset_offset_minutes = -30, sunrise_offset_minutes = 60}
#   active_hours = {type = "fixed", start = "21:00", end = "05:00"}
#
enabled     = true
filter_json = "filters/uk_nocturnal_filter.json"


[species_filter]
# Exclude species from the BOU allowlist based on their british_list_status.
# Each species' status field is split on commas; any token that appears in
# exclude_status (case-insensitive) causes the species to be dropped.
#
# Meaningful tokens to exclude (with species count and examples):
#
#   "Accidental"        — 255 species: one-off vagrants with no regular UK presence
#                         (e.g. Falcated Duck, Cedar Waxwing, Sandhill Crane).
#                         Most useful for a garden detector focused on regular UK birds.
#
#   "Introduced Breeder" — 5 species: non-native species still largely
#                         dependent on releases or with tiny/declining populations
#                         (Pheasant, Red-legged Partridge, Golden Pheasant,
#                         Lady Amherst's Pheasant, Ruddy Duck).
#                         Note: Canada Goose, Egyptian Goose, Mandarin Duck,
#                         Ring-necked Parakeet and Little Owl are classified as
#                         "Introduced/Resident Breeder" — naturalised self-sustaining
#                         populations not caught by this token.
#
#   "Escaped Breeder"   — 4 species: feral birds of captive origin
#                         (Barnacle Goose, Red-crested Pochard, Night Heron,
#                         Eurasian Eagle-Owl).
#                         Note: Barnacle Goose and Night Heron also have genuine
#                         wild populations — exclude with care.
#
# Tokens NOT recommended for exclusion:
#   "Re-introduced Breeder" — native UK birds reintroduced by conservation programmes
#                             (Capercaillie, Goshawk, White-tailed Eagle).
#   "Former Breeder"        — rare but genuine sightings (e.g. White Stork, Wryneck).
#   "Former Scarce Breeder" — Spoonbill; actively re-colonising Norfolk.
#
# Leave empty (default) to accept all BTO-listed species.
exclude_status = ["Accidental"]

# Per-species admission override: add  species_status_override = true  to a
# [species."Name"] block to admit a species that would otherwise be suppressed
# by exclude_status above.  Useful for known local vagrant populations.
#
# Example — a known local King Eider which is normally "Accidental":
#   [species."King Eider"]
#   species_status_override = true


[retention]
# Automatic cleanup of data/detections/ clips.
# The cleanup thread runs on startup and then every run_interval_seconds.
enabled               = true
max_age_days          = 30     # delete clips older than this (0 = disable age check)
max_usage_percent     = 90.0   # also purge oldest clips when disk is this full
min_clips_per_species = 5      # always retain at least this many clips per species
run_interval_seconds  = 3600


[log]
# Rotating log file written alongside stdout.
enabled  = true
path     = "data/bird_detector.log"

# Verbosity: DEBUG | INFO | WARNING | ERROR | CRITICAL
# DEBUG shows seasonal/BOU filter decisions for individual detections.
level = "DEBUG"

# rotation = "daily" — new file each midnight; keeps backup_count previous files.
# rotation = "size"  — rotate when the file exceeds max_size_bytes.
rotation       = "daily"
max_size_bytes = 10485760   # 10 MB — only used when rotation = "size"
backup_count   = 7


[database]
# "sqlite" (default, zero config) or "postgresql".
# For TimescaleDB: keep type = "postgresql" and set timescaledb = true.
# Note: the dashboard always reads the SQLite file directly — postgresql affects
# the detector only.  psycopg2-binary required for postgresql.
type        = "sqlite"
host        = "localhost"
port        = 5432
name        = "birds"
username    = ""
password    = ""
timescaledb = false


[mqtt]
# Publish each detection as JSON to an MQTT broker.
# Requires: pip install paho-mqtt
enabled  = false
broker   = "localhost"
port     = 1883
topic    = "birds/detections"
username = ""
password = ""
retain   = false


[birdweather]
# Forward detections to app.birdweather.com.
# Register a station at https://app.birdweather.com to obtain a token
# (Station → Token on the station settings page).
enabled      = false
token        = ""     # station authentication token
upload_audio = true   # upload FLAC clip as a soundscape before posting the detection


[birdmap]
# Forward detections to birdmap.co.uk.
# Register at birdmap.co.uk to obtain an API key and station ID.
enabled      = false
api_url      = "http://localhost:8000"
api_key      = "bm_RMeuZyv7jmZo07h89zMZnJuPo0I0hguyw14SUAW9UJb8yBDK"
station_id   = 1
upload_audio = true   # include base64-encoded WAV clip in each POST (max 2 MB)


[cross_validation]
# Re-evaluate each confirmed detection with the secondary model (whichever of
# birdnet/perch is not the primary).  Both models must be installed.
# Species agreement is compared via BTO-resolved names to bridge label-namespace
# differences.  When models agree, confidence is set to the arithmetic mean.
enabled        = true
skip_threshold = 0.90   # primary confidence >= this → skip CV (high-confidence shortcut)

# Action when models disagree on species:
#   "drop" — discard the detection (default; maximises precision)
#   "flag" — save with flagged = true for manual dashboard review
on_disagree = "drop"

# Minimum secondary-model confidence to count as a candidate.
# Keep low (≈ 0.01) because Perch softmax probabilities over ~10 000+ classes
# are far smaller than BirdNET logistic scores; a clear Perch match may only
# reach 0.03–0.08.
cv_min_confidence = 0.01


# ── Per-species overrides ──────────────────────────────────────────────────────
# Override any [defaults] key for a specific species.  The name must match the
# common name printed in the terminal.  Keys not listed fall back to [defaults].
#
# active_hours overrides the nocturnal filter window for this species:
#   active_hours = {type = "sunset_sunrise", sunset_offset_minutes = -30, sunrise_offset_minutes = 60}
#   active_hours = {type = "fixed", start = "21:00", end = "05:00"}
#
# Add on_disagree = "flag" to review CV disagreements rather than silently dropping.

[species."House Sparrow"]
min_confidence   = 0.70
cooldown_seconds = 120

[species."Eurasian Skylark"]
min_confidence   = 0.40
min_detections = 1

[species."Tawny Owl"]
min_detections = 1
#on_disagree    = "flag"

[species."Barn Owl"]
min_detections = 1
#on_disagree    = "flag"

[species."King Eider"]
min_confidence = 0.1
species_status_override = true


# ── Weather metadata ───────────────────────────────────────────────────────────
# Attach a weather snapshot to every saved detection.
# Data is cached for cache_seconds (default 300 s) so a burst of detections
# only triggers a single upstream API call.
#
# provider options
# ────────────────
#   "open_meteo"      — Open-Meteo (https://open-meteo.com); completely free,
#                       no account or API key required.
#
#   "yr_no"           — Yr.no / Norwegian Meteorological Institute
#                       (https://api.met.no); free, no key required.
#
#   "openweathermap"  — OpenWeatherMap (https://openweathermap.org); free tier
#                       available.  Requires api_key (sign up for a free key).
#
#   "pws"             — Personal Weather Station plugin.  Set pws_plugin to
#                       the name of a weather_pws_<name>.py file in this
#                       directory.  Built-in plugin: "meteobridge".

[weather]
enabled       = false
provider      = "open_meteo"   # "open_meteo" | "yr_no" | "openweathermap" | "pws"
api_key       = ""             # only required for provider = "openweathermap"
cache_seconds = 300            # reuse the same reading within this window (seconds)

# Only used when provider = "pws":
pws_plugin = "meteobridge"     # selects weather_pws_meteobridge.py

# ── Meteobridge PWS plugin ─────────────────────────────────────────────────────
# Davis Vantage Vue (or any station supported by Meteobridge).
# Meteobridge HTTP template API with Basic Auth.
#
# template variable order is fixed: temp ; humidity ; wind_speed ; wind_dir ;
# pressure ; rain_rate.  Edit sensor indices (th0, wind0, msl0, rain0) if your
# station uses different numbering.  Null readings returned by Meteobridge as
# "------" are automatically treated as missing values.
#
# wind_speed_unit: "ms"  → Meteobridge reports wind in m/s  (metric default)
#                  "kmh" → Meteobridge reports wind in km/h (auto-converted to m/s)

[weather.pws_meteobridge]
host            = "192.168.1.100"
port            = 80
username        = "meteobridge"
password        = "meteobridge"
wind_speed_unit = "ms"
template        = "[th0temp-act];[th0hum-act];[wind0avgspd-act];[wind0dir-act];[msl0press-act];[rain0rate-act]"

# ── Tempest WeatherFlow PWS plugin ─────────────────────────────────────────────
# WeatherFlow Tempest smart weather station via the cloud API.
# Requires a numeric station_id and a personal access token from:
#   https://tempestwx.com → Settings → Data Authorizations
#
# To use:
#   [weather]
#   provider   = "pws"
#   pws_plugin = "tempest"
#
# Returns temperature (°C), humidity (%), wind speed (m/s), wind direction (°),
# sea-level pressure (hPa), precipitation last hour (mm), and a human-readable
# sky condition string (e.g. "Clear", "Partly Cloudy", "Light Rain").

[weather.pws_tempest]
station_id = 0               # numeric station ID from tempestwx.com
token      = ""              # personal access token from tempestwx.com
