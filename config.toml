# ── Bird Detector Configuration ───────────────────────────────────────────────

[general]
# IANA timezone name for the detector's location.
# Timestamps are always stored in UTC; this setting controls how dates and
# times are displayed in the dashboard and how "today" / period filters work.
# UK users: "Europe/London" handles GMT (winter, UTC+0) and BST (summer, UTC+1)
# automatically — no manual adjustment needed when the clocks change.
timezone = "Europe/London"

# Display name shown in the dashboard header. Leave empty to use the default
# "BirdNet-UK".
station_name = "TheCLinks"


[location]
# WGS-84 decimal degrees. Used for sunrise/sunset calculations.
lat = 52.69867   # Norfolk, UK
lon = 1.67531


[paths]
# Directory where detected audio clips are saved
detections_dir = "data/detections"

# SQLite database file
db_path = "data/birds.db"


[audio]
# Recording sample rate in Hz.  This is the rate used to capture audio from
# the microphone — it is NOT the model's input rate.  Both BirdNET (resamples
# internally) and Perch (resampled explicitly in inference_perch.py) accept
# audio at any rate, so this value should match whatever your hardware actually
# supports.  48000 Hz is recommended and works with virtually all modern
# microphones and USB audio interfaces; use 44100 only if your hardware
# does not support 48000.
sample_rate    = 48000
hop_seconds    = 1      # advance the rolling window by this many seconds each step

# Clip mode controls how much audio is saved around each detection.
#
#   "window"  — save exactly the model analysis window plus window_pad_seconds
#               of leading audio.  No post-detection audio is included.
#                 BirdNET: 0.5 + 3 = 3.5 s   Perch: 0.5 + 5 = 5.5 s
#               Recommended: produces clean single-species clips, ready for
#               model fine-tuning, and uses ~5× less disk than "full".
#
#   "full"    — legacy dual-buffer behaviour: save clip_seconds of audio
#               centred on the detection (pre_capture_seconds before the window,
#               the remainder after).  Useful for manual listening with context.
#               clip layout: |-- pre_capture --|-- model window --|-- post_capture --|
#                            <------------- clip_seconds (15 s) ------------------>
#
clip_mode           = "window"
window_pad_seconds  = 0.5   # leading audio before the detection window (0.0–10.0 s)
                             # only used when clip_mode = "window"

# Settings used only when clip_mode = "full":
clip_seconds            = 15   # total saved clip length in seconds
pre_capture_seconds     = 2    # extra audio before the analysis window
capture_buffer_seconds  = 30   # ring buffer size; must be > clip_seconds + margin

# Microphone device index (from `python -m sounddevice`).
# Device 0 = HDA Intel PCH: CX8200 Analog (hw:0,0) — physical mic/line-in jack.
# Set to 0 to use PipeWire instead if you need PipeWire routing.
device = 0


[defaults]
# Detections with confidence below this value are suppressed
min_confidence = 0.6

# Minimum gap (seconds) between saved clips for the same species
cooldown_seconds = 30

# Confirmation filter: a species must be detected this many times within
# confirmation_window_seconds before it is saved.  This filters transient
# false positives without running inference more frequently.
# Set min_detections = 1 to disable (save on first hit, original behaviour).
# With hop_seconds = 1 and window_seconds = 3, each second produces one new
# inference result, so min_detections = 3 requires ~3 s of repeated signal.
min_detections             = 2
confirmation_window_seconds = 9

# Labels that are never surfaced as detections (case-insensitive).
# Includes generic BirdNET labels and all 198 FSD50K non-bird sound classes
# from the Perch v2 inat2024_fsd50k label namespace.  The BOU filter provides
# an independent second line of defence, but listing them here means they are
# dropped in run_inference() regardless of whether bou_filter is enabled.
noise_labels = [
  # Generic BirdNET labels
  "background", "noise", "silence", "other",
  # All Perch FSD50K non-bird sound classes (198 entries, auto-lowercased on load)
  "Accelerating_and_revving_and_vroom", "Accordion", "Acoustic_guitar",
